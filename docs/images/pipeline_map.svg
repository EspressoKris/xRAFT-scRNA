<svg xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Metro-style map: four lines run from Novogene tar archives or existing FASTQs through extraction, Cell Ranger, optional Souporcell, CellBender and Seurat object creation to Seurat (.rds) or AnnData (.h5ad) objects per library">
  <style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.stage{fill:#2b2c31;stroke:#3b3c43}.stage-title{font-size:15px;font-weight:700;fill:#e8e6e1}
.stage-num{font-size:11px;font-weight:600;fill:#e8e6e1}.num-ring{fill:none;stroke:#e8e6e1;stroke-width:1.5}
.label{font-size:13px;font-weight:600;fill:#e8e6e1}.sub{font-size:11px;fill:#9a9890}
.track{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.l1{stroke:#1e9bd8}.l2{stroke:#2bb673}.l3{stroke:#f2a51f}.l4{stroke:#e4473d}
.station{fill:#f3f1ec;stroke:#1f2024;stroke-width:2.5}.station-core{fill:#1f2024}
.gpu-ring{fill:none;stroke:#c56bd6;stroke-width:2.5;stroke-dasharray:5 3}
.doc-body{fill:#f3f1ec;stroke:#1f2024;stroke-width:2;stroke-linejoin:round}
.doc-fold{fill:none;stroke:#1f2024;stroke-width:2;stroke-linejoin:round}
.badge{fill:#1f2024}.badge-text{font-size:11px;font-weight:700;fill:#f3f1ec}
.caption{font-size:13px;font-weight:700;fill:#e8e6e1}.arrow{fill:#2bb673}
.spur{fill:none;stroke:#9a9890;stroke-width:3;stroke-linecap:round;stroke-dasharray:6 5}
.train{stroke:#f3f1ec;stroke-width:4;stroke-linecap:round;fill:none;stroke-dasharray:26 400;opacity:.9;animation:ride 8s linear infinite}
.d1{animation-delay:0s}.d2{animation-delay:-2s}.d3{animation-delay:-4s}.d4{animation-delay:-6s}
@keyframes ride{from{stroke-dashoffset:426}to{stroke-dashoffset:0}}
</style>
<rect width="1280" height="400" fill="#1f2024"/>
  <defs>
    <g id="doc"><path class="doc-body" d="M0 0h24l10 10v34H0z"/><path class="doc-fold" d="M24 0v10h10"/></g>
    <g id="stack"><use href="#doc" x="10" y="-10"/><use href="#doc" x="5" y="-5"/><use href="#doc"/></g>
  </defs>

  <!-- stage panels -->
  <rect class="stage" x="20" y="60" width="360" height="300" rx="14"/>
  <rect class="stage" x="410" y="60" width="560" height="300" rx="14"/>
  <rect class="stage" x="1000" y="60" width="260" height="300" rx="14"/>
  <g><circle class="num-ring" cx="42" cy="46" r="9"/><text class="stage-num" x="42" y="50" text-anchor="middle">1</text><text class="stage-title" x="60" y="50">Input processing</text></g>
  <g><circle class="num-ring" cx="432" cy="46" r="9"/><text class="stage-num" x="432" y="50" text-anchor="middle">2</text><text class="stage-title" x="450" y="50">Count, demultiplex, clean</text></g>
  <g><circle class="num-ring" cx="1022" cy="46" r="9"/><text class="stage-num" x="1022" y="50" text-anchor="middle">3</text><text class="stage-title" x="1040" y="50">Object creation</text></g>

  <!-- input icons -->
  <g transform="translate(44 122)"><use href="#stack"/><rect class="badge" x="-6" y="18" width="46" height="16" rx="4"/><text class="badge-text" x="17" y="30" text-anchor="middle">tar</text></g>
  <text class="caption" x="66" y="190" text-anchor="middle">Novogene</text>
  <text class="sub" x="66" y="204" text-anchor="middle">Raw_Data</text>

  <g transform="translate(44 252)"><use href="#stack"/><rect class="badge" x="-8" y="18" width="50" height="16" rx="4"/><text class="badge-text" x="17" y="30" text-anchor="middle">fastq</text></g>
  <text class="caption" x="66" y="320" text-anchor="middle">Reads</text>
  <text class="sub" x="66" y="334" text-anchor="middle">fastq_dir</text>

  <g transform="translate(150 300)"><use href="#doc"/><rect class="badge" x="-6" y="18" width="46" height="16" rx="4"/><text class="badge-text" x="17" y="30" text-anchor="middle">tsv</text></g>
  <text class="caption" x="196" y="320">Sample sheet</text>
  <text class="sub" x="196" y="334">library_id, fastq_dir, Raw_Data, souporcell_k</text>

  <!-- TRACKS: l1 tar+pooled, l2 tar+single, l3 fastq+pooled, l4 fastq+single. Bundle spacing 6px. -->
  <path id="t1" class="track l1" d="M92 141 H160 H290 C320 141 320 166 350 166 H460 H560 C600 166 600 251 640 251 H740 C780 251 780 166 820 166 H900 H1040 H1100"/>
  <path id="t2" class="track l2" d="M92 147 H160 H290 C320 147 320 172 350 172 H460 H560 H900 H1040 H1100"/>
  <path id="t3" class="track l3" d="M92 271 H230 C280 271 280 178 330 178 H460 H560 C600 178 600 263 640 263 H740 C780 263 780 178 820 178 H900 H1040 H1100"/>
  <path id="t4" class="track l4" d="M92 277 H230 C280 277 280 184 330 184 H460 H560 H900 H1040 H1100"/>
  <path class="train d1" d="M92 141 H160 H290 C320 141 320 166 350 166 H460 H560 C600 166 600 251 640 251 H740 C780 251 780 166 820 166 H900 H1040 H1100"/>
  <path class="train d2" d="M92 147 H160 H290 C320 147 320 172 350 172 H460 H560 H900 H1040 H1100"/>
  <path class="train d3" d="M92 271 H230 C280 271 280 178 330 178 H460 H560 C600 178 600 263 640 263 H740 C780 263 780 178 820 178 H900 H1040 H1100"/>
  <path class="train d4" d="M92 277 H230 C280 277 280 184 330 184 H460 H560 H900 H1040 H1100"/>


  <!-- stations -->
  <g><rect class="station optin" x="154" y="131" width="12" height="22" rx="6"/></g>
  <text class="label" x="160" y="118" text-anchor="middle">Extract</text>
  <text class="sub" x="160" y="104" text-anchor="middle">(untar, MD5 verify)</text>

  <g><rect class="station default" x="284" y="131" width="12" height="22" rx="6"/><rect class="station-core" x="288" y="137" width="4" height="10" rx="2"/></g>
  <text class="label" x="290" y="118" text-anchor="middle">Libraries CSV</text>
  <text class="sub" x="290" y="104" text-anchor="middle">(auto-detect prefixes)</text>

  <g><rect class="station default" x="224" y="261" width="12" height="22" rx="6"/><rect class="station-core" x="228" y="267" width="4" height="10" rx="2"/></g>
  <text class="sub" x="230" y="250" text-anchor="middle">Libraries CSV</text>

  <g><rect class="station default" x="454" y="154" width="12" height="42" rx="6"/><rect class="station-core" x="458" y="168" width="4" height="14" rx="2"/></g>
  <text class="label" x="460" y="140" text-anchor="middle">Cell Ranger count</text>
  <text class="sub" x="460" y="126" text-anchor="middle">(cellranger 9.0.0)</text>

  <g><rect class="station optin" x="684" y="245" width="12" height="24" rx="6"/></g>
  <text class="label" x="690" y="296" text-anchor="middle">Souporcell</text>
  <text class="sub" x="690" y="310" text-anchor="middle">(genetic demultiplexing, k donors, Apptainer)</text>

  <g><rect class="gpu-ring" x="888" y="148" width="24" height="54" rx="12"/><rect class="station default" x="894" y="154" width="12" height="42" rx="6"/><rect class="station-core" x="898" y="168" width="4" height="14" rx="2"/></g>
  <text class="label" x="900" y="134" text-anchor="middle">CellBender</text>
  <text class="sub" x="900" y="120" text-anchor="middle">(ambient RNA removal, GPU, Apptainer)</text>

  <g><rect class="station default" x="1094" y="154" width="12" height="42" rx="6"/><rect class="station-core" x="1098" y="168" width="4" height="14" rx="2"/></g>
  <text class="label" x="1100" y="140" text-anchor="middle">Object creation</text>
  <text class="sub" x="1100" y="224" text-anchor="middle">raw + CellBender counts</text>
  <text class="sub" x="1100" y="238" text-anchor="middle">Souporcell donor metadata</text>
  <path class="spur" d="M1106 160 C1150 160 1150 112 1196 112"/>
  <path class="spur" d="M1106 190 C1150 190 1150 262 1196 262"/>

  <path class="arrow" d="M335 196 l10 6 l-10 6 z"/>

  <!-- output icon -->
  <g transform="translate(1200 92)"><use href="#stack"/><rect class="badge" x="-6" y="18" width="46" height="16" rx="4"/><text class="badge-text" x="17" y="30" text-anchor="middle">rds</text></g>
  <text class="caption" x="1222" y="160" text-anchor="middle">Seurat</text>
  <g transform="translate(1200 242)"><use href="#stack"/><rect class="badge" x="-8" y="18" width="50" height="16" rx="4"/><text class="badge-text" x="17" y="30" text-anchor="middle">h5ad</text></g>
  <text class="caption" x="1222" y="310" text-anchor="middle">AnnData</text>

  <text class="sub" x="1016" y="330">params.output_format: seurat, scanpy or both</text>
</svg>